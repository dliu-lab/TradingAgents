services:
  tradingagents:
    build: .
    env_file:
      - .env
    environment:
      - CODEX_APP_SERVER_COMMAND=codex
      - CODEX_APP_SERVER_CWD=/home/appuser/app
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
      - ${HOME}/.codex:/home/appuser/.codex
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=ollama
      - CODEX_APP_SERVER_COMMAND=codex
      - CODEX_APP_SERVER_CWD=/home/appuser/app
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
      - ${HOME}/.codex:/home/appuser/.codex
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
